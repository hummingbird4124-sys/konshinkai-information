<style>
.hero {
  position: relative;
  color: white;
  padding: 70px 20px;
  overflow: hidden;
}

/* 背景画像 */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d') center/cover;
  z-index: 0;
}

/* 青いオーバーレイ */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(30,58,95,0.9), rgba(47,95,158,0.8));
  z-index: 1;
}

/* テキスト前面 */
.hero-content {
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-size: 22px;
  margin-bottom: 5px;
}

.hero p {
  font-size: 14px;
  opacity: 0.9;
}
</style>

<div class="hero">
  <div class="hero-content">
    <h1>懇親会だより</h1>
    <p>つながる・支え合う・よりよい未来へ</p>
  </div>
</div>
