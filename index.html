<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>懇親会だより</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
*{ box-sizing:border-box; }

html,body{
  margin:0;
  width:100%;
  overflow-x:hidden;
}

body{
  font-family:'Noto Sans JP',sans-serif;
  background:#f5f8fc;
  color:#1a1a1a;
}

/* 上部 */
.topbar{
  height:64px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#0b63c7;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.logo-title{
  font-size:15px;
  font-weight:800;
  color:#17477d;
}

.logo-sub{
  font-size:11px;
  color:#333;
}

.menu{
  font-size:28px;
  color:#222;
}

/* ヘッダー画像 */
.hero{
  height:190px;
  color:#fff;
  display:flex;
  align-items:center;
  padding:26px 24px;
  background:
    linear-gradient(90deg,rgba(0,48,120,.96),rgba(0,70,150,.75),rgba(0,70,150,.08)),
    url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
}

.hero-catch{
  font-size:13px;
  font-weight:500;
  margin-bottom:8px;
}

.hero h1{
  font-size:32px;
  margin:0 0 8px;
  font-weight:800;
}

.hero-sub{
  font-size:14px;
  font-weight:500;
}

/* ドット */
.dots{
  text-align:center;
  background:#fff;
  padding:10px 0 18px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  background:#d4d8df;
  border-radius:50%;
  margin:0 4px;
}

.dot.active{ background:#0b63c7; }

.container{
  max-width:620px;
  margin:auto;
  padding:0 18px 34px;
}

/* セクション */
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:18px 0 10px;
}

.section-title{
  display:flex;
  align-items:center;
  font-size:20px;
  font-weight:800;
  color:#064b9f;
}

.section-title .material-icons{
  font-size:22px;
  margin-right:7px;
  color:#0b63c7;
}

.see-all{
  font-size:13px;
  font-weight:700;
  color:#0b63c7;
}

/* カード */
.card{
  background:#fff;
  border-radius:14px;
  box-shadow:0 5px 16px rgba(0,0,0,.08);
  overflow:hidden;
}

/* 議事録 */
.meeting-card{
  margin-bottom:20px;
}

.meeting-head{
  background:#f2f6fb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 16px;
}

.meeting-head h2{
  margin:0;
  font-size:16px;
  font-weight:800;
  color:#111;
}

.meeting-meta{
  display:flex;
  gap:10px;
  font-size:12px;
  color:#555;
  white-space:nowrap;
}

.meeting-body{
  padding:16px;
}

.meeting-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px 18px;
}

.meeting-block{
  min-height:84px;
}

.block-title{
  font-size:13px;
  color:#0b63c7;
  font-weight:800;
  margin-bottom:6px;
}

.block-title::before{
  content:"■";
  font-size:8px;
  margin-right:5px;
}

.meeting-block p,
.meeting-block ul{
  font-size:11.5px;
  line-height:1.65;
  color:#333;
  margin:0;
}

.meeting-block ul{
  padding-left:16px;
}

.meeting-bottom{
  border-top:1px solid #e5e9ef;
  margin-top:12px;
  padding-top:12px;
}

/* 横長カード */
.article-card{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px;
  margin-bottom:18px;
}

.article-card img{
  width:126px;
  height:82px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
}

.article-text{
  flex:1;
  min-width:0;
}

.article-label{
  font-size:11px;
  color:#666;
  margin-bottom:3px;
}

.article-title{
  font-size:14
