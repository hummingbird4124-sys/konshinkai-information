<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>懇親会だより</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;overflow-x:hidden}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f8fc;color:#1a1a1a;line-height:1.6}
a{color:inherit;text-decoration:none}
.topbar{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;border-radius:50%;background:#0b63c7;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo-title{font-size:15px;font-weight:800;color:#17477d;line-height:1.1}
.logo-sub{font-size:11px;color:#333}
.menu{font-size:28px}
.hero{min-height:184px;color:#fff;display:flex;align-items:center;padding:24px 20px;background:linear-gradient(90deg,rgba(0,48,120,.96),rgba(0,70,150,.78),rgba(0,70,150,.18)),url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat}
.hero-catch{font-size:13px;margin-bottom:8px}
.hero h1{font-size:30px;line-height:1.2;margin:0 0 8px;font-weight:800}
.hero-sub{font-size:14px}
.dots{text-align:center;background:#fff;padding:10px 0 18px}
.dot{display:inline-block;width:8px;height:8px;background:#d4d8df;border-radius:50%;margin:0 4px}
.dot.active{background:#0b63c7}
.container{max-width:620px;margin:0 auto;padding:0 14px 34px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 10px}
.section-title{display:flex;align-items:center;font-size:19px;font-weight:800;color:#064b9f}
.section-title .material-icons{font-size:22px;margin-right:7px;color:#0b63c7}
.see-all{font-size:13px;font-weight:700;color:#0b63c7;white-space:nowrap}
.card{background:#fff;border-radius:14px;box-shadow:0 5px 16px rgba(0,0,0,.08);overflow:hidden}
.archive-card{display:flex;align-items:flex-start;gap:12px;padding:12px;margin-bottom:18px}
.archive-card img{width:118px;height:86px;object-fit:cover;border-radius:9px;flex-shrink:0;background:#e9eef5}
.archive-kicker{display:inline-block;background:#0b63c7;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;margin-bottom:5px}
.archive-title{font-size:14px;font-weight:800;color:#222;line-height:1.45;margin-bottom:5px}
.archive-desc{font-size:12px;color:#444;line-height:1.65;margin-bottom:6px}
.sample-space{height:20px}
@media(max-width:360px){
  .hero h1{font-size:27px}
  .section-title{font-size:17px}
  .archive-card{gap:10px}
  .archive-card img{width:96px;height:76px}
  .archive-title{font-size:13px}
  .archive-desc{font-size:11.5px}
}
@media(min-width:560px){
  .container{padding:0 18px 34px}
  .archive-card img{width:150px;height:96px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">
    <div class="logo-icon">👥</div>
    <div>
      <div class="logo-title">懇親会</div>
      <div class="logo-sub">公式ホームページ</div>
    </div>
  </div>
  <div class="menu">☰</div>
</header>

<section class="hero">
  <div>
    <div class="hero-catch">つながる・支え合う・より良い未来へ</div>
    <h1>懇親会だより</h1>
    <div class="hero-sub">今月の活動・お知らせをお届けします</div>
  </div>
</section>

<div class="dots">
  <span class="dot active"></span>
  <span class="dot"></span>
  <span class="dot"></span>
</div>

<main class="container">

  <div class="section-head">
    <div class="section-title">
      <span class="material-icons">inventory_2</span>
      重要アーカイブ
    </div>
    <div class="see-all">営業攻略</div>
  </div>

  <a class="card archive-card" href="sumo-guide.html">
    <img src="sumo-guide.jpg" alt="大相撲両国場所 営業ガイド">
    <div>
      <div class="archive-kicker">永久保存版</div>
      <div class="archive-title">大相撲 両国場所<br>営業攻略ガイド</div>
      <div class="archive-desc">
        結びの一番後の人流、狙い目時間帯、周辺道路の注意点をまとめています。
      </div>
      <div class="see-all">詳細を見る →</div>
    </div>
  </a>

  <div class="sample-space"></div>

</main>

</body>
</html>
